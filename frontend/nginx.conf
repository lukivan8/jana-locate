server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index _shell.html;
    location = /healthz { access_log off; default_type application/json; return 200 '{"status":"ok"}'; }
    location = /config.js { add_header Cache-Control "no-store" always; }
    location /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location / { try_files $uri $uri/ /_shell.html; add_header Cache-Control "no-cache"; }
}
