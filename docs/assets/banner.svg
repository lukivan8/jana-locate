<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Jana Locate — нормализация адресов Казахстана</title>
  <desc id="desc">HTTP API для своего сервиса, проверка в браузере и локальная работа с PostgreSQL. Схематический пример выделения адресных полей.</desc>
  <rect width="1280" height="420" rx="24" fill="#f2f5ed"/>
  <rect x="0" y="0" width="10" height="420" fill="#117d01"/>
  <g font-family="DejaVu Sans,Arial,sans-serif">
    <text x="56" y="68" fill="#54634d" font-size="16" letter-spacing="3">АДРЕСА КАЗАХСТАНА</text>
    <text x="52" y="150" fill="#117d01" font-size="68" font-weight="700">jana<tspan fill="#1a1c18" font-weight="400"> locate</tspan></text>
    <text x="56" y="207" fill="#1a1c18" font-size="27">Нормализация адресов</text>
    <text x="56" y="245" fill="#1a1c18" font-size="27">для вашего сервиса</text>
    <text x="56" y="291" fill="#54634d" font-size="17">Исходная строка → поля → проверка</text>
    <rect x="56" y="335" width="106" height="36" rx="18" fill="#117d01"/>
    <text x="76" y="359" fill="white" font-size="14">HTTP API</text>
    <rect x="173" y="335" width="165" height="36" rx="18" fill="#d7e8cc"/>
    <text x="192" y="359" fill="#121f0e" font-size="14">Веб-интерфейс</text>
    <rect x="349" y="335" width="170" height="36" rx="18" fill="#d7e8cc"/>
    <text x="369" y="359" fill="#121f0e" font-size="14">CLI + PostgreSQL</text>
    <rect x="684" y="48" width="540" height="324" rx="18" fill="#fff" stroke="#d4dccd"/>
    <text x="710" y="84" fill="#54634d" font-size="13" letter-spacing="1">ПРИМЕР СТРУКТУРЫ</text>
    <line x1="710" y1="104" x2="1198" y2="104" stroke="#dfe4d7"/>
    <text x="710" y="140" fill="#1a1c18" font-size="19">Астана, проспект Туран 55/6 кв 99</text>
    <rect x="710" y="163" width="488" height="40" rx="8" fill="#edf5e7"/>
    <text x="726" y="189" fill="#117d01" font-family="DejaVu Sans Mono,monospace" font-size="17">POST /v1/normalize</text>
    <g font-family="DejaVu Sans Mono,monospace" font-size="17">
      <text x="726" y="239" fill="#54634d">city<tspan x="910" fill="#1a1c18">Астана</tspan></text>
      <text x="726" y="271" fill="#54634d">street_name<tspan x="910" fill="#1a1c18">Туран</tspan></text>
      <text x="726" y="303" fill="#54634d">house<tspan x="910" fill="#1a1c18">55/6</tspan></text>
      <text x="726" y="335" fill="#54634d">apartment<tspan x="910" fill="#1a1c18">99</tspan></text>
    </g>
  </g>
</svg>
