# Hackathon numeric supplement. Dependencies are installed only during build.
services:
  backend:
    networks: [default, numeric-private]
    environment:
      NUMERIC_SUPPLEMENT_URL: http://numeric:8080
    depends_on:
      numeric:
        condition: service_healthy
  numeric:
    networks: [numeric-private]
    image: jana-numeric:0.2.0
    build:
      context: ./backend/numeric
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 128m
    cpus: 1
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
networks:
  default: {}
  numeric-private:
    internal: true
