# Isolated synthetic PostgreSQL and real normalization API for local testing.
services:
  workspace:
    volumes:
      - ./tests/addresses.json:/fixtures/addresses.json:ro
    environment:
      JANA_API_URL: http://normalizer:8080
      JANA_DATABASE_URL: postgresql://jana_demo:synthetic-only@postgres:5432/jana_demo?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      normalizer:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jana_demo
      POSTGRES_PASSWORD: synthetic-only
      POSTGRES_DB: jana_demo
    volumes:
      - demo-postgres:/var/lib/postgresql/data
      - ./tests/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jana_demo -d jana_demo"]
      interval: 2s
      timeout: 3s
      retries: 30
  normalizer:
    image: jana-address-api:local
    build:
      context: ../backend
    environment:
      MODELS_REQUIRED: "false"
      ALLOW_DEMO_CATALOG: "false"
    volumes:
      - demo-catalog:/data
volumes:
  demo-postgres:
  demo-catalog:
