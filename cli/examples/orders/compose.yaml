# Standalone synthetic orders database. No application/API or production data.
name: jana-orders-example
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orders_example
      POSTGRES_USER: orders_demo
      POSTGRES_PASSWORD: example-only-password
    ports:
      - "127.0.0.1:${ORDERS_EXAMPLE_PORT:-15432}:5432"
    volumes:
      - orders-data:/var/lib/postgresql/data
      - ./seed.sql:/docker-entrypoint-initdb.d/001-orders.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders_demo -d orders_example"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  orders-data:
