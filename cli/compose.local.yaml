# Local API + embedded review site/CLI; database connections are user supplied.
name: jana-cli-local
services:
  workspace:
    image: jana-cli:local
    build:
      context: .
    ports:
      - "127.0.0.1:${CLI_PORT:-8095}:8095"
    environment:
      JANA_API_URL: http://normalizer:8080
      JANA_API_TOKEN: "${JANA_API_TOKEN:-}"
      JANA_WEB_AUTH: "${JANA_WEB_AUTH:-none}"
      JANA_WEB_TOKEN: "${JANA_WEB_TOKEN:-}"
      JANA_DATABASE_URL: "${JANA_DATABASE_URL:-}"
      PGHOST: "${PGHOST:-host.docker.internal}"
      PGPORT: "${PGPORT:-5432}"
      PGDATABASE: "${PGDATABASE:-postgres}"
      PGUSER: "${PGUSER:-postgres}"
      PGPASSWORD: "${PGPASSWORD:-}"
      JANA_BROWSER_URL: "${JANA_BROWSER_URL:-http://localhost:${CLI_PORT:-8095}/}"
      JANA_PUBLIC_ORIGIN: "${JANA_PUBLIC_ORIGIN:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - workspace-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    depends_on:
      normalizer:
        condition: service_healthy
  normalizer:
    image: jana-address-api:local
    build:
      context: ../backend
    ports:
      - "127.0.0.1:${CLI_API_PORT:-8080}:8080"
    environment:
      MODELS_REQUIRED: "true"
      NUMERIC_SUPPLEMENT_URL: http://numeric:8080
      ALLOW_DEMO_CATALOG: "false"
    networks: [default, numeric-private]
    depends_on:
      numeric:
        condition: service_healthy
    volumes:
      - normalizer-data:/data
    restart: unless-stopped
  numeric:
    image: jana-numeric:0.3.0
    build:
      context: ../backend/numeric
    networks: [numeric-private]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 128m
    cpus: 1
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
networks:
  default: {}
  numeric-private:
    internal: true
volumes:
  workspace-data:
  normalizer-data:
