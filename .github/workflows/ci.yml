name: Проверки приложения
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            cli/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: make reference
      - run: make check
      - run: make generate && git diff --exit-code -- backend/pkg/api/types.gen.go frontend/src/api cli/internal/api/types.gen.go cli/api
      - name: Numeric model, Unicode features and standalone image
        run: |
          python3 backend/numeric/test_numeric_recovery.py
          docker build -t jana-numeric:0.3.0 backend/numeric
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Browser integration against isolated local backend
        run: |
          cd backend
          ALLOW_DEMO_CATALOG=true CATALOG_OVERLAY_PATH="$RUNNER_TEMP/catalog.confirmed.json" go run ./cmd/server > "$RUNNER_TEMP/jana-api.log" 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://localhost:8080/readyz && break; sleep 1; done
          cd ../frontend
          npm run test:e2e
      - name: Compose build, startup and restart persistence
        run: make smoke
      - name: Standalone CLI, PostgreSQL publication and restart
        run: make cli-smoke
      - name: Offline restart with outbound network disabled
        run: make offline-smoke
