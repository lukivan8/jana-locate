name: Проверки приложения
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            cli/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: make reference
      - run: make check
      - run: make generate && git diff --exit-code -- backend/pkg/api/types.gen.go frontend/src/api cli/internal/api/types.gen.go cli/api
      - name: Numeric model, Unicode features and standalone image
        run: |
          python3 backend/numeric/test_numeric_recovery.py
          docker build -t jana-numeric:0.3.0 backend/numeric
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Compose build, startup and restart persistence
        run: make smoke
      - name: Browser integration against the full offline normalizer
        env:
          JANA_TEST_WEB_URL: http://localhost:13001
          CORS_ORIGINS: http://localhost:13001
        run: |
          compose() { docker compose -p jana-browser-test -f compose.yaml -f compose.numeric.yaml "$@"; }
          cleanup() {
            compose logs --no-color > "$RUNNER_TEMP/jana-browser.log"
            compose down --volumes --remove-orphans
          }
          trap cleanup EXIT
          compose up --no-build --pull never -d --wait --wait-timeout 300 backend
          (cd frontend && npm run test:e2e)
      - name: Browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: |
            frontend/test-results/
            ${{ runner.temp }}/jana-browser.log
      - name: Standalone CLI, PostgreSQL publication and restart
        run: make cli-smoke
      - name: Offline restart with outbound network disabled
        run: make offline-smoke
