# Optional candidate. Omit this file and CONTEXTUAL_NORMALIZER_URL to use native baseline.
services:
  backend:
    environment:
      CONTEXTUAL_NORMALIZER_URL: http://contextual:8080
    depends_on:
      contextual:
        condition: service_healthy
  contextual:
    image: jana-contextual:v7
    build:
      context: ./backend/contextual
    environment:
      HF_HOME: /tmp/huggingface
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 4g
    cpus: 2
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    stop_grace_period: 300s
